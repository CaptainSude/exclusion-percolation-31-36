name: Verify Lean

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Full proof and axiom audit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build with the pinned toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: 'false'
          build: 'true'
          build-args: '--wfail'
          use-mathlib-cache: 'true'
